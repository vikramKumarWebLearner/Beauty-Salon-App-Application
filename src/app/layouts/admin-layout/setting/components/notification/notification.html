<div class="mt-6 space-y-6">

    <div class="rounded-lg border bg-card shadow-sm">

        <!-- Header -->
        <div class="p-6">
            <h3 class="text-2xl font-semibold">Notification Preferences</h3>
            <p class="text-sm text-muted-foreground">
                Manage how you receive notifications
            </p>
        </div>

        <div class="p-6 pt-0 space-y-6">

            <!-- Email -->
            <div class="flex items-center justify-between">
                <div>
                    <label class="text-sm font-medium">Email Notifications</label>
                    <p class="text-sm text-muted-foreground">Receive via email</p>
                </div>

                <button type="button" role="switch" (click)="toggle('email')"
                    [attr.aria-checked]="notificationSettings().email"
                    [attr.data-state]="notificationSettings().email ? 'checked' : 'unchecked'" class="relative inline-flex h-6 w-11 items-center rounded-full
                 transition-colors duration-200
                 data-[state=checked]:bg-pink-500
                 data-[state=unchecked]:bg-gray-300">

                    <span [attr.data-state]="notificationSettings().email ? 'checked' : 'unchecked'" class="inline-block h-5 w-5 rounded-full bg-white shadow
                   transition-transform duration-200
                   translate-x-1
                   data-[state=checked]:translate-x-5">
                    </span>
                </button>
            </div>

            <!-- SMS -->
            <div class="flex items-center justify-between">
                <label class="text-sm font-medium">SMS Notifications</label>

                <button type="button" role="switch" (click)="toggle('sms')"
                    [attr.aria-checked]="notificationSettings().sms"
                    [attr.data-state]="notificationSettings().sms ? 'checked' : 'unchecked'" class="relative inline-flex h-6 w-11 items-center rounded-full
                 transition-colors duration-200
                 data-[state=checked]:bg-pink-500
                 data-[state=unchecked]:bg-gray-300">

                    <span [attr.data-state]="notificationSettings().sms ? 'checked' : 'unchecked'" class="inline-block h-5 w-5 rounded-full bg-white shadow
                   transition-transform duration-200
                   translate-x-1
                   data-[state=checked]:translate-x-5">
                    </span>
                </button>
            </div>

            <!-- Push -->
            <div class="flex items-center justify-between">
                <label class="text-sm font-medium">Push Notifications</label>

                <button type="button" role="switch" (click)="toggle('push')"
                    [attr.aria-checked]="notificationSettings().push"
                    [attr.data-state]="notificationSettings().push ? 'checked' : 'unchecked'" class="relative inline-flex h-6 w-11 items-center rounded-full
                 transition-colors duration-200
                 data-[state=checked]:bg-pink-500
                 data-[state=unchecked]:bg-gray-300">

                    <span [attr.data-state]="notificationSettings().push ? 'checked' : 'unchecked'" class="inline-block h-5 w-5 rounded-full bg-white shadow
                   transition-transform duration-200
                   translate-x-1
                   data-[state=checked]:translate-x-5">
                    </span>
                </button>
            </div>

            <!-- Save Button -->
            <button (click)="save()" [disabled]="loading" class="mt-4 rounded-md bg-pink-500 px-4 py-2 text-white">
                {{ loading ? 'Saving...' : 'Save Preferences' }}
            </button>

        </div>
    </div>
</div>
