<div class="flex min-h-screen relative">

    <!-- Desktop Sidebar (hidden on small screens) -->
    <app-sidebar class="min-h-screen transition-all duration-300 hidden sm:flex z-40" [items]="sidebarItems()"
        [collapsed]="collapsed()">
    </app-sidebar>

    <!-- Mobile Sidebar Overlay -->
    @if (sidebarOpen()) {
    <div class="fixed inset-0 z-50 flex">
        <div class="fixed inset-0 bg-black/40" (click)="closeMobileSidebar()"></div>
        <div class="relative w-64 bg-white shadow-lg">
            <app-sidebar [items]="sidebarItems()" [collapsed]="false"
                (isMobiletoggleSidebar)="isMobileToggleSidebar()"></app-sidebar>
        </div>
    </div>
    }
    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <app-navbar (toggleSidebar)="toggleSidebar()" class="z-0"></app-navbar>
        <main class="flex-1 bg-gray-50 p-6">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
