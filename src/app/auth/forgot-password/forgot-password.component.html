<div class="min-h-screen bg-amber-50 flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-sm border">
        <div class="text-center p-6">
            <h2 class="text-3xl font-serif text-gray-800">Forget Password</h2>
        </div>
        <form [formGroup]="forgetPasswordForm" (ngSubmit)="onForgotPassword()" class="px-6 pb-6 space-y-6">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700" for="email">Email</label>
                <input id="email" type="email" formControlName="email" placeholder="Enter your email"
                    (input)="onFieldInput()"
                    [class]="'w-full rounded-[10px] border px-4 py-2 focus:outline-none focus:ring-2 ' + 
                    (hasFieldError('email') ? 'border-red-500 bg-red-50 focus:ring-red-300' : 'border-gray-200 bg-amber-50 focus:ring-pink-300')" />
                @if (hasFieldError('email')) {
                <div class="text-sm text-red-600 mt-1">
                    {{ getFieldError('email') }}
                </div>
                }
            </div>
            <button type="submit" [disabled]="isLoading()"
                class="w-full rounded-[10px] bg-pink-500 text-white font-medium py-3 hover:bg-pink-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                @if (!isLoading()) {
                <span>Reset Password</span>
                } @else {
                <span class="flex items-center justify-center">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Resetting Password...
                </span>
                }
            </button>
            <div class="text-center space-y-2">
                <p class="text-sm text-gray-500">
                    <a routerLink="login" class="text-pink-600 hover:underline">Sign in</a>
                </p>
            </div>
        </form>
    </div>
</div>
