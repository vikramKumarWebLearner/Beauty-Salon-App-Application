<div class="min-h-screen bg-amber-50 flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-sm border">

        <div class="text-center p-6">
            <h2 class="text-3xl font-serif text-gray-800">Reset Password</h2>
            <p class="text-sm text-gray-500 mt-2">
                Enter your new password below
            </p>
        </div>

        <form [formGroup]="resetPasswordForm" (ngSubmit)="onResetPassword()" class="px-6 pb-6 space-y-6">

            <!-- New Password -->
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">
                    New Password
                </label>

                <div class="relative">
                    <input [type]="showCurrent() ? 'text' : 'password'" formControlName="password"
                        placeholder="Enter new password" (input)="onFieldInput()" [class]="'w-full rounded-[10px] border px-4 py-2 pr-10 focus:outline-none focus:ring-2 ' +
      (hasFieldError('password')
        ? 'border-red-500 bg-red-50 focus:ring-red-300'
        : 'border-gray-200 bg-amber-50 focus:ring-pink-300')" />

                    <!-- Eye Toggle -->
                    <button type="button" (click)="toggleCurrent()"
                        class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-gray-700">
                        <lucide-icon [name]="showCurrent() ? EyeOff : Eye" size="18"></lucide-icon>
                    </button>
                </div>

                @if (hasFieldError('password')) {
                <div class="text-sm text-red-600 mt-1">
                    {{ getFieldError('password') }}
                </div>
                }
            </div>


            <!-- Confirm Password -->
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">
                    Confirm Password
                </label>

                <div class="relative">
                    <input [type]="showConfirm() ? 'text' : 'password'" formControlName="confirmPassword"
                        placeholder="Confirm new password" (input)="onFieldInput()" [class]="'w-full rounded-[10px] border px-4 py-2 pr-10 focus:outline-none focus:ring-2 ' +
      (hasFieldError('confirmPassword')
        ? 'border-red-500 bg-red-50 focus:ring-red-300'
        : 'border-gray-200 bg-amber-50 focus:ring-pink-300')" />

                    <!-- Eye Toggle -->
                    <button type="button" (click)="toggleConfirm()"
                        class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-gray-700">
                        <lucide-icon [name]="showConfirm() ? EyeOff : Eye" size="18"></lucide-icon>
                    </button>
                </div>

                @if (hasFieldError('confirmPassword')) {
                <div class="text-sm text-red-600 mt-1">
                    {{ getFieldError('confirmPassword') }}
                </div>
                }
            </div>


            <!-- Submit -->
            <button type="submit" [disabled]="isLoading()"
                class="w-full rounded-[10px] bg-pink-500 text-white font-medium py-3 hover:bg-pink-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                @if (!isLoading()) {
                <span>Reset Password</span>
                } @else {
                <span class="flex items-center justify-center">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z">
                        </path>
                    </svg>
                    Resetting...
                </span>
                }
            </button>

            <!-- Footer -->
            <div class="text-center">
                <a routerLink="/login" class="text-sm text-pink-600 hover:underline">
                    Back to login
                </a>
            </div>

        </form>
    </div>
</div>
